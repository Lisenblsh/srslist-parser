[package]
name = "srs-reader"
version = "0.1.0"
edition = "2024"

[dependencies]
flate2 = "1"
reqwest = { version = "0.13", features = ["stream"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
serde_json = "1.0.151"
serde = {version = "1.0.229", features = ["derive"]}
regex = "1"
